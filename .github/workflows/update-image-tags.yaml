name: Update Image Tags

on:
  repository_dispatch:
    types: [app-image-built]

permissions:
  contents: write

jobs:
  update-tags:
    name: Update image tags
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout platform repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITOPS_PAT || github.token }}
          ref: main

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update image tags in helm-values
        run: |
          set -euo pipefail

          IMAGE_TAG="${{ github.event.client_payload.sha }}"
          SERVICES="${{ github.event.client_payload.services }}"

          echo "Image Tag: ${IMAGE_TAG}"
          echo "Services: ${SERVICES}"

          if [ -z "${IMAGE_TAG}" ]; then
            echo "IMAGE_TAG is empty"
            exit 1
          fi

          if [ -z "${SERVICES}" ]; then
            echo "SERVICES is empty"
            exit 1
          fi

          for SERVICE in ${SERVICES}; do
            VALUES_FILE="helm-values/${SERVICE}.yaml"

            if [ -f "${VALUES_FILE}" ]; then
              echo "Updating ${VALUES_FILE}"

              sed -i "s|^[[:space:]]*tag: .*|  tag: \"${IMAGE_TAG}\"|" "${VALUES_FILE}"

              echo "Updated ${VALUES_FILE}"
            else
              echo "Warning: ${VALUES_FILE} not found, skipping"
            fi
          done

          echo "Git diff:"
          git diff

      - name: Commit updated tags
        id: commit
        run: |
          git add helm-values/

          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update image tags to ${{ github.event.client_payload.sha }}"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger ArgoCD deploy workflow
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          IMAGE_TAG: ${{ github.event.client_payload.sha }}
          SERVICES: ${{ github.event.client_payload.services }}
          DEPLOY_ENVIRONMENT: ${{ github.event.client_payload.environment || 'dev' }}
        with:
          github-token: ${{ secrets.GITOPS_PAT || github.token }}
          script: |
            const services = process.env.SERVICES
              .split(/[\s,]+/)
              .map((service) => service.trim())
              .filter(Boolean);

            if (services.length === 0) {
              throw new Error('No services were resolved from the repository_dispatch payload.');
            }

            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'deploy-argocd',
              client_payload: {
                environment: process.env.DEPLOY_ENVIRONMENT,
                image_tag: process.env.IMAGE_TAG,
                services: services.join(' '),
                changed_services: services.join(' '),
                apply_applications: 'true',
                wait_applications: 'true'
              }
            });

            core.info(`Triggered deploy-argocd for: ${services.join(', ')}`);
